name: Deploy Vercel

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL ainda não foi configurado. A integração Git da Vercel continua como caminho principal."
            exit 0
          fi
          curl --fail --show-error --silent \
            --request POST \
            "$VERCEL_DEPLOY_HOOK_URL"
          echo
          echo "Deploy de produção da Vercel solicitado com sucesso."
